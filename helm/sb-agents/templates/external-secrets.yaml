# Secret `sb-agents`: every key any pod here uses. Each Deployment picks only its
# own keys by secretKeyRef (mt-agent's MT token never reaches sb-support-api).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sb-agents
  labels:
    {{- include "sb-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: sb-agents
    creationPolicy: Owner
  data:
  {{- range $key, $prop := dict "ANTHROPIC_API_KEY" "sb_agents_anthropic_api_key" "MT_AGENT_MCP_TOKEN" "sb_agents_mt_mcp_token" "SB_SUPPORT_API_TOKEN" "sb_agents_api_token" }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $.Values.externalSecret.awsSecretName }}
      property: {{ $prop }}
  {{- end }}
---
# GHCR pull secret, as myrunstreak-ghcr: the same PAT, read from AWS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sb-agents-ghcr
  labels:
    {{- include "sb-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: sb-agents-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"silverbeer","password":"{{ "{{ .ghcr_pat }}" }}","auth":"{{ "{{ printf \"silverbeer:%s\" .ghcr_pat | b64enc }}" }}"}}}'
  data:
  - secretKey: ghcr_pat
    remoteRef:
      key: {{ .Values.externalSecret.awsSecretName }}
      property: ghcr_pat
