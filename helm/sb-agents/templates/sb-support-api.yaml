# MT app adapter (SB-1500): MT's backend → sb-support core over HTTP, in-cluster.
# ClusterIP only: no Ingress. MT reaches it at
# http://sb-support-api.{{ .Release.Namespace }}.svc.cluster.local:8103.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-support-api
  labels:
    app: sb-support-api
    {{- include "sb-agents.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One in-memory conversation store at a time.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sb-support-api}
  template:
    metadata:
      labels: {app: sb-support-api}
    spec:
      {{- include "sb-agents.podCommon" . | nindent 6 }}
      # Specialists are discovered once, at startup: wait for their agent cards so
      # a node restart (all pods at once) doesn't start the API with none.
      initContainers:
      - name: wait-for-specialists
        image: {{ include "sb-agents.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - python
        - -c
        - |
          import os, time, urllib.request
          urls = os.environ["SB_SUPPORT_SPECIALISTS"].split(",")
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  for u in urls:
                      urllib.request.urlopen(u + "/.well-known/agent-card.json", timeout=3)
                  break
              except OSError:
                  time.sleep(3)
          else:
              raise SystemExit("specialists not ready after 180s")
        env:
        - {name: SB_SUPPORT_SPECIALISTS, value: {{ include "sb-agents.specialists" . | quote }}}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      containers:
      - name: sb-support-api
        image: {{ include "sb-agents.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [sb-support-api]
        ports:
        - {name: http, containerPort: 8103}
        env:
        {{- include "sb-agents.commonEnv" . | nindent 8 }}
        - name: SB_SUPPORT_API_TOKEN
          valueFrom: {secretKeyRef: {name: sb-agents, key: SB_SUPPORT_API_TOKEN}}
        - {name: SB_SUPPORT_API_HOST, value: "0.0.0.0"}
        - {name: SB_SUPPORT_SPECIALISTS, value: {{ include "sb-agents.specialists" . | quote }}}
        # No SB_SUPPORT_DB: MT app users are signed in, so "my team" comes from
        # their MT account (SB-1529), not from saved preferences.
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: http}
          periodSeconds: 20
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sb-support-api
  labels:
    {{- include "sb-agents.labels" . | nindent 4 }}
spec:
  selector: {app: sb-support-api}
  ports:
  - {name: http, port: 8103, targetPort: http}
