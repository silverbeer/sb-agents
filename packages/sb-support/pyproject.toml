[project]
name = "sb-support"
version = "0.1.0"
description = "Support agent core with Slack (Socket Mode) and MT app (HTTP) adapters"
requires-python = ">=3.13"
dependencies = [
    "sb-models",
    "sb-obs",
    "pydantic-ai-slim[anthropic]>=2.64",
    "slack-bolt>=1.30",
    "aiohttp>=3.10",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
sb-support = "sb_support.slack:main"
sb-support-api = "sb_support.api:main"
sb-support-eval = "sb_support.evals:main"

[tool.uv.sources]
sb-models = { workspace = true }
sb-obs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
