[project]
name = "motw-agent"
version = "0.1.0"
description = "Weekly MissingTable Match of the Week suggestions, posted to Slack for approval"
requires-python = ">=3.13"
dependencies = [
    "sb-models",
    "sb-obs[evals]",
    "pydantic-ai-slim[anthropic]>=2.64",
    "pydantic-evals>=2.64",
    "mcp>=2.3",  # mt-mcp suggest_motw_candidates
    "httpx>=0.27",  # MT REST: GET /api/motw
    "slack-sdk>=3.33",
]

[project.scripts]
motw-agent = "motw_agent.cli:main"
motw-agent-eval = "motw_agent.evals:main"

[tool.uv.sources]
sb-models = { workspace = true }
sb-obs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
