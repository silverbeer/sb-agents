  timeZone: America/New_York
  startingDeadlineSeconds: 21600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app: motw-agent}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          hostAliases:
          - ip: 192.168.5.2
            hostnames: [host.lima.internal]
          containers:
          - name: motw-agent
            image: sb-agents:IMAGE_TAG
            imagePullPolicy: Never
            command: [motw-agent, remind]
            envFrom:
            - secretRef: {name: motw-agent}
