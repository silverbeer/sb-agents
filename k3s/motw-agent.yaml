            env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://host.lima.internal:4318"}
            - {name: SB_ENV, value: homelab}
            - {name: SB_OBS_CAPTURE_CONTENT, value: "1"}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 512Mi}
